[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oddsiq"
version = "0.1.0"
description = "Multi-sport (NBA/NHL/MLB/WNBA/NFL) value-betting engine — Tipsport vs Pinnacle sharp-line CLV"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "rapidfuzz>=3.0",
    "python-dotenv>=1.0",
    # Pinned to a minor range like Playwright below: the Tipsport fast path
    # hardcodes the impersonation target (TIPSPORT_IMPERSONATE = "chrome146"),
    # and a curl_cffi bump that drops/renames that target would silently break
    # the scraper the same way the unpinned Playwright jump did on 2026-05-30.
    "curl_cffi~=0.15.0",
    # Pinned to a minor range: Playwright's bundled browser-build version is
    # coupled to the package version, and `playwright install` must be re-run
    # on every bump. An unpinned jump to 1.60 silently broke Tipsport on
    # 2026-05-30 (missing browser binary). See oddsiq/scrapers/preflight.py.
    "playwright~=1.60.0",
    "fastapi>=0.110",
    # FastAPI Form() parsing for the /betting dashboard write controls
    # (arm/disarm/config POSTs).
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27",
    # The betting bridge's WS server (oddsiq/pipeline/betting_bridge.py).
    # Already a transitive dep via uvicorn[standard]; pinned explicitly so a
    # uvicorn extras change can't silently remove it.
    "websockets>=12",
    "jinja2>=3.1",
    # zoneinfo has no system tz database on Windows (and slim Linux images);
    # tzdata provides the fallback so ZoneInfo("Europe/Prague") never raises.
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Default high-signal set: pyflakes (F: unused imports/vars, undefined names) +
# pycodestyle errors (E4 import, E7 statement, E9 syntax). Deliberately NOT the
# style/line-length rules (E5/W) — this is a lint gate, not an auto-formatter.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Test modules legitimately import after a `pytest.importorskip(...)` guard and
# place setup-dependent imports mid-file — E402 there is intentional.
"tests/**" = ["E402"]

[project.scripts]
oddsiq = "oddsiq.cli:main"

[tool.setuptools.packages.find]
include = ["oddsiq*"]
