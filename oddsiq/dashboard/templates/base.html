<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OddsIQ · {% block title %}{{ page }}{% endblock %}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0C0E0D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='7' fill='%23B8FF3C'/%3E%3Cpath d='M9 21l5-6 4 3 5-8' stroke='%230a1500' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/dashboard.css?v={{ asset_version }}">
<script src="/static/htmx.min.js" defer></script>
<script src="/static/chart.umd.min.js" defer></script>
<script src="/static/charts.js?v={{ asset_version }}" defer></script>
</head>
<body data-page="{{ page }}" data-autorefresh="1">
<header class="nav">
  <strong>OddsIQ</strong>
  <nav class="pages">
    <a href="/live" {% if page == "live" %}aria-current="page"{% endif %}>Live</a>
    <a href="/upcoming" {% if page == "upcoming" %}aria-current="page"{% endif %}>Upcoming</a>
    <a href="/betting" {% if page == "betting" %}aria-current="page"{% endif %}>Betting</a>
    <a href="/analysis" {% if page == "analysis" %}aria-current="page"{% endif %}>Analysis</a>
    <a href="/settings" {% if page == "settings" %}aria-current="page"{% endif %}>Settings</a>
  </nav>
  <div class="nav-right">
    <span id="nav-engine"
          hx-get="/betting/partials/state-dot"
          hx-trigger="load, every 60s from:body[data-autorefresh='1'], refreshAll from:body"
          hx-swap="innerHTML"></span>
    {% if (enabled_sports or []) | length > 1 %}
    <nav class="sport-tabs" aria-label="Sport filter">
      <a href="?sport="{% if not sport %} aria-current="page"{% endif %}>All</a>
      {% for _key in (enabled_sports or []) %}
        <a href="?sport={{ _key }}"{% if sport == _key %} aria-current="page"{% endif %}>{{ _key | upper }}</a>
      {% endfor %}
    </nav>
    {% endif %}
    <button id="refresh-all" type="button" title="Refresh all sections"><span class="ic">↻</span><span class="btn-label"> Refresh all</span></button>
  </div>
</header>
<main>{% block content %}{% endblock %}</main>
<div id="htmx-error" role="alert" aria-live="assertive" title="Click to dismiss"
     style="display:none;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;max-width:min(560px,92vw);padding:10px 14px;border-radius:8px;border:1px solid #7a2323;background:#2a0e0eee;color:#ffd9d9;font-family:var(--font-mono);font-size:11.5px;line-height:1.5;box-shadow:0 6px 20px #0009;cursor:pointer"></div>
<script>
// Never let a failed htmx request be silent: htmx does not swap a non-2xx
// response, so a 401/403/503 on a control POST would otherwise look like a
// dead button. Surface the status + the server's detail instead.
(function () {
  const banner = document.getElementById("htmx-error");
  if (!banner) {
    return;
  }
  let hideTimer = null;
  function show(text) {
    banner.textContent = text;
    banner.style.display = "block";
    if (hideTimer) {
      clearTimeout(hideTimer);
    }
    hideTimer = setTimeout(function () { banner.style.display = "none"; }, 15000);
  }
  document.body.addEventListener("htmx:responseError", function (evt) {
    const xhr = (evt.detail && evt.detail.xhr) || {};
    const status = xhr.status || 0;
    let detail = "";
    try {
      detail = (JSON.parse(xhr.responseText || "{}").detail) || "";
    } catch (e) {
      detail = "";
    }
    let hint = "";
    if (status === 401) {
      hint = " Reload the page and sign in to send controls.";
    } else if (status === 403) {
      hint = " Controls are disabled or the request was cross-origin.";
    } else if (status === 503) {
      hint = " Set DASHBOARD_CONTROLS_USERNAME/PASSWORD on the host.";
    }
    show("Request failed — HTTP " + status + (detail ? ": " + detail : "") + "." + hint);
  });
  document.body.addEventListener("htmx:sendError", function () {
    show("Request failed — the dashboard could not reach the server.");
  });
  // Dismiss on click only: the page auto-refreshes its sections, so hiding on
  // the next successful request would erase the message within a second.
  banner.addEventListener("click", function () { banner.style.display = "none"; });
})();
</script>
<script>
(function () {
  function applyAutoRefreshPreference() {
    const enabled = localStorage.getItem("autorefresh") !== "0";
    document.body.dataset.autorefresh = enabled ? "1" : "0";
    document.querySelectorAll("[data-autorefresh-toggle]").forEach((toggle) => {
      toggle.checked = enabled;
    });
  }

  window.oddsiqSetAutoRefresh = function (enabled) {
    localStorage.setItem("autorefresh", enabled ? "1" : "0");
    applyAutoRefreshPreference();
  };

  document.addEventListener("DOMContentLoaded", function () {
    applyAutoRefreshPreference();
    const refreshAll = document.getElementById("refresh-all");
    if (!refreshAll) {
      return;
    }
    refreshAll.addEventListener("click", function () {
      const targets = Array.from(document.querySelectorAll("main [data-refresh-section]"))
        .filter((target) => !target.querySelector("[data-refresh-section]"));
      if (targets.length === 0) {
        window.location.reload();
        return;
      }
      htmx.trigger(document.body, "refreshAll");
    });
  });
})();
</script>
</body>
</html>
